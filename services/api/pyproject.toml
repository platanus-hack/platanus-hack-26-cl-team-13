[project]
name = "aigis"
version = "0.1.0"
description = "AIgis: orquestador, gateway y carriles de defensa para agentes"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "sse-starlette",
    "sqlalchemy",
    "docker",
    "e2b",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6",
    "asyncpg>=0.30",
]

[dependency-groups]
dev = [
    "pytest",
    "anyio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aigis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not docker and not e2b'"
markers = [
    "docker: requiere Docker y la imagen del sandbox",
    "e2b: requiere E2B_API_KEY y la plantilla aigis-sandbox",
]
