# Blueprint de Render. Render solo conecta repos propios: se despliega desde el espejo
# personal del repo (ver README, "Deploying & integrations").
# Todo en la misma región: el orquestador habla con Postgres por la red privada de Render.

databases:
  # Corridas, eventos, filtraciones, diffs y costo (PostgresStore). Sin acceso público.
  - name: aigis-db
    databaseName: aigis
    user: aigis
    plan: basic-256mb
    region: oregon
    ipAllowList: []          # solo red privada

services:
  # Gateway del modelo (P2). Guarda la key; las cajas solo reciben un token por corrida con tope.
  # El Dockerfile.gateway llega con la rama del gateway.
  - type: web
    name: aigis-gateway
    runtime: docker
    region: oregon
    plan: starter            # el plan gratis duerme y se pierden los tokens en memoria
    dockerfilePath: ./services/api/Dockerfile.gateway
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GATEWAY_UPSTREAM_URL
        sync: false          # https://llm.hack.platan.us/t/<phk_token>/anthropic
      - key: GATEWAY_UPSTREAM_API_KEY
        sync: false
      - key: GATEWAY_ADMIN_TOKEN
        generateValue: true  # el orquestador lo toma de aquí
      - key: GATEWAY_MODEL
        value: claude-haiku-5-5

  - type: web
    name: aigis-api
    runtime: docker
    region: oregon
    plan: starter            # el plan gratis duerme el servicio y se pierden corridas en curso
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: AIGIS_SANDBOX_PROVIDER
        value: e2b
      - key: AIGIS_ENV_NAME
        value: render
      - key: AIGIS_AGENT
        value: scripted      # claude cuando el gateway de P2 esté arriba
      - key: AIGIS_PUBLIC_BASE_URL
        sync: false          # https://aigis-api.onrender.com (host exacto, sin comodines)
      - key: AIGIS_GATEWAY_STUB
        value: "true"        # false cuando aigis-gateway tenga la key del upstream
      - key: AIGIS_GATEWAY_URL
        sync: false          # https://aigis-gateway.onrender.com
      - key: AIGIS_GATEWAY_URL_SANDBOX
        sync: false          # la misma URL pública HTTPS: host exacto y puerto 443 para el filtro de E2B
      - key: AIGIS_GATEWAY_ADMIN_TOKEN
        fromService:
          type: web
          name: aigis-gateway
          envVarKey: GATEWAY_ADMIN_TOKEN
      - key: DATABASE_URL
        fromDatabase:
          name: aigis-db
          property: connectionString   # cadena interna, por red privada
      - key: AIGIS_ATTACKER_URL_SANDBOX
        sync: false
      - key: AIGIS_WEBHOOK_SECRET
        generateValue: true
      - key: AIGIS_API_TOKEN
        generateValue: true
      - key: AIGIS_CORS_ORIGINS
        sync: false          # URL de la web de P4
      - key: E2B_API_KEY
        sync: false

  # Panel del equipo y web de P4 (Next.js). El navegador habla solo con este servicio;
  # el proxy /api/gemelo reenvía a aigis-api con AIGIS_API_TOKEN, incluido el SSE.
  - type: web
    name: aigis-web
    runtime: node
    plan: starter            # el gratis duerme y corta el SSE de las corridas largas
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    startCommand: npm start  # next start toma $PORT de Render
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: AIGIS_API_URL
        sync: false          # https://aigis-api.onrender.com
      - key: AIGIS_API_TOKEN
        fromService:
          type: web
          name: aigis-api
          envVarKey: AIGIS_API_TOKEN
      - key: PANEL_PASSWORD
        sync: false          # contraseña compartida del equipo
      - key: PANEL_SECRET
        generateValue: true  # firma la cookie de sesión
